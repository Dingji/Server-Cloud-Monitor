<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NoteBox 分享</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cg stroke-linejoin='round' stroke='%233730a3' stroke-width='.8'%3E%3Cg%3E%3Cpath d='M12 3.2 20.7 7.7 12 12.2 3.3 7.7Z' fill='%234f46e5'/%3E%3Cpath d='M3.3 7.7v8.4L12 20.6v-8.4' fill='%23c7d2fe'/%3E%3Cpath d='M20.7 7.7v8.4L12 20.6v-8.4' fill='%23a5b4fc'/%3E%3CanimateTransform attributeName='transform' type='translate' values='0 0; 0 -1.1; 0 0' dur='2.6s' repeatCount='indefinite'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="share-page">

  <header class="share-top">
    <div class="share-brand"><span class="nav-ico brand-ico" data-ico="box"></span>NoteBox</div>
    <span class="pill ok">分享笔记 · 无需登录</span>
  </header>

  <main class="share-main">
    <div id="share-loading" class="share-state">
      <span class="ico-slot" data-ico="spinner"></span>
      正在加载分享内容…
    </div>

    <div id="share-error" class="share-state hidden">
      <span class="ico-slot state-warn" data-ico="warn"></span>
      <p id="share-error-msg">分享链接无效或已失效</p>
      <a class="btn primary" href="/">回到 NoteBox</a>
    </div>

    <article id="share-article" class="share-card hidden">
      <h1 id="share-title">…</h1>
      <div class="share-meta">
        <span id="share-time"></span>
        <span id="share-tags" class="share-tags"></span>
      </div>
      <div id="share-body" class="markdown"></div>
    </article>
  </main>

  <footer class="share-foot">由 <b>NoteBox</b> 云端笔记分享 · 渲染成品直接阅读，无需账号</footer>

  <script src="/static/icons.js"></script>
  <script src="/static/md.js"></script>
  <script src="/static/share.js"></script>
</body>
</html>
