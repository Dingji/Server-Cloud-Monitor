org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072m

# Apple target 只能在 macOS 上链接。本机（Windows）开发时 iOS 的 klib 类型检查用
# tests/ios-gate.ps1（内部带 -Pkotlin.native.enableKlibsCrossCompilation=true）。
# 这一行只是压掉 KGP 关于「本机构建不了该 target」的重复提示，不改变任何构建结果。
kotlin.native.ignoreDisabledTargets=true

android.useAndroidX=true
android.suppressUnsupportedCompileSdk=37

# AGP 9.x: com.android.application 与 org.jetbrains.kotlin.multiplatform 互斥（built-in Kotlin 冲突）。
# 保持 KMP + application 组合（要出 APK），按 AGP 官方提示关掉 built-in Kotlin 与新 DSL。
android.builtInKotlin=false
android.newDsl=false
# 注意：KGP 仍会打一条 `w: The 'org.jetbrains.kotlin.multiplatform' plugin deprecated
# compatibility with Android Gradle plugin: 'com.android.application'`。
# 它来自插件自身的版本策略，不是源码告警；唯一的开关
# kotlin.mpp.androidGradlePluginCompatibility.nowarn 已废弃，用了会再多一条
# 「Deprecated Gradle Property Used」，反而更吵，所以这里不设。
# 真正消掉它要换 com.android.kotlin.multiplatform.library（需重构 composeApp 的 Android 侧）。

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
