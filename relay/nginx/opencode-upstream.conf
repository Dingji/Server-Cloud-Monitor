# Shared upstream settings for the OpenCode relay (Go + Zen routes).
# Included by each proxy location.
#
# The official OpenCode key lives in /etc/relay/upstream-auth.conf and is injected
# there, so it can be rotated at runtime from the dashboard without editing this file.

proxy_http_version 1.1;
proxy_ssl_server_name on;
# SNI must be the real host: an upstream group name is not a valid TLS server name.
proxy_ssl_name opencode.ai;
proxy_ssl_session_reuse on;      # resume TLS sessions on reconnect
proxy_set_header Host opencode.ai;
# The upstream credential (and $relay_exhausted) is injected by the including
# location, before its no-quota guard, so the flag is set when it is read.
# Identity encoding keeps streamed responses simple
proxy_set_header Accept-Encoding "";
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $relay_connection;
# Streaming (SSE) must not be buffered
proxy_buffering off;
proxy_request_buffering on;      # required for replaying a failed attempt
proxy_cache off;

# ── upstream resilience ─────────────────────────────────────────────
proxy_socket_keepalive on;          # TCP keepalive towards opencode.ai
proxy_connect_timeout 5s;            # fail a dead edge address fast
proxy_send_timeout 3600s;           # slow upload (large prompts) tolerated
proxy_read_timeout 3600s;           # long streams / long thinking gaps
# Retry on a different upstream IP when a request fails before any response
# reaches the client. max_fails/fail_timeout in the upstream block handle the
# rest of the failover.
proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504 non_idempotent;
proxy_next_upstream_tries 4;
proxy_next_upstream_timeout 30s;