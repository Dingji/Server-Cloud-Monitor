# Shared upstream settings for the MiMo Token Plan (CN) route (/mimo/...).
# The credential is injected by the including location (mimo-auth.conf).

proxy_http_version 1.1;
proxy_ssl_server_name on;
proxy_ssl_name token-plan-cn.xiaomimimo.com;
proxy_ssl_session_reuse on;
proxy_set_header Host token-plan-cn.xiaomimimo.com;
proxy_set_header Accept-Encoding "";
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $relay_connection;
proxy_buffering off;
proxy_request_buffering on;
proxy_cache off;

proxy_socket_keepalive on;
proxy_connect_timeout 5s;
proxy_send_timeout 3600s;
proxy_read_timeout 3600s;
proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504 non_idempotent;
proxy_next_upstream_tries 3;
proxy_next_upstream_timeout 30s;
